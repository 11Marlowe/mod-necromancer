# Necromancer skill line ("Necromancy", id 700) and its spell mappings.
# SkillLineAbility rows are cloned from the model spells' own rows
# (686/695/705/2973/14260/168/6789) so the client groups our spells in a
# spellbook tab; Death Coil (6789) is shared with Warlocks.
SkillLine.dbc:
  - type: insert
    key: 700
    values:
      id: 700
      categoryId: 7
      skillCostID: 0
      name_lang_0: "Necromancy"
      name_lang_1: "Necromancy"
      name_lang_2: "Necromancy"
      name_lang_3: "Necromancy"
      name_lang_4: "Necromancy"
      name_lang_5: "Necromancy"
      name_lang_6: "Necromancy"
      name_lang_7: "Necromancy"
      nameFlags: 4128894
      spellIcon: 547

