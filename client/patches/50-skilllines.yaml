  - { type: copy, key: 1431, values: { id: 7212, skillId: 700, spellId: 61011, classmask: 512 } }
  - { type: copy, key: 1432, values: { id: 7213, skillId: 700, spellId: 61012, classmask: 512 } }
  - { type: copy, key: 1921, values: { id: 7214, skillId: 700, spellId: 61013, classmask: 512 } }
  - { type: copy, key: 2153, values: { id: 7215, skillId: 700, spellId: 61014, classmask: 512 } }
