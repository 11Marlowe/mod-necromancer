# Necromancer spellbook tabs (A87, 2026-10-19): Reanimation (700),
# Blood (701) and Plague (702), like a vanilla class's spellbook tabs.
# SkillLineAbility rows are cloned from the model spells' own rows and
# reassigned to the tab their design tree belongs to.  The three rank-1
# starting spells keep learnOnGetSkill (donor default 2) so they grant the
# skill lines; all later spells/ranks are trainer-taught or quest rewards.
SkillLine.dbc:
  - type: insert
    key: 700
    values:
      id: 700
      categoryId: 7
      skillCostID: 0
      name_lang_0: "Reanimation"
      name_lang_1: "Reanimation"
      name_lang_2: "Reanimation"
      name_lang_3: "Reanimation"
      name_lang_4: "Reanimation"
      name_lang_5: "Reanimation"
      name_lang_6: "Reanimation"
      name_lang_7: "Reanimation"
      nameFlags: 4128894
      spellIcon: 547
  - type: insert
    key: 701
    values:
      id: 701
      categoryId: 7
      skillCostID: 0
      name_lang_0: "Blood"
      name_lang_1: "Blood"
      name_lang_2: "Blood"
      name_lang_3: "Blood"
      name_lang_4: "Blood"
      name_lang_5: "Blood"
      name_lang_6: "Blood"
      name_lang_7: "Blood"
      nameFlags: 4128894
      spellIcon: 514
  - type: insert
    key: 702
    values:
      id: 702
      categoryId: 7
      skillCostID: 0
      name_lang_0: "Plague"
      name_lang_1: "Plague"
      name_lang_2: "Plague"
      name_lang_3: "Plague"
      name_lang_4: "Plague"
      name_lang_5: "Plague"
      name_lang_6: "Plague"
      name_lang_7: "Plague"
      nameFlags: 4128894
      spellIcon: 183

