# Spell.dbc - Necromancer class spells (batches 1-3).
#
# NOTE: in this 1.12.1 client's Spell.dbc the field the schema calls
# `NameSubtext_lang_N` is actually the spell RANK string (DBC columns
# 129-136).  We set it to "Rank N" so tooltips/spellbook show ranks.
#
# Mechanics are copied from the model spells:
# batch 1 (IDs 61010-61015):
#   Plague Bolt R1-3 <- Shadow Bolt 686/695/705
#   Reap R1-2        <- Raptor Strike 2973/14260 (mana melee strike)
#   Bone Armor       <- Frost Armor 168
# batch 2 (IDs 61016-61023, disease mechanics):
#   Call of the Grave R1-3 <- Corruption 6222/6223/7648 (dispel -> disease)
#   Desecration R1-3       <- Rain of Fire 5740/6219/11677 (dispel -> disease)
#   Disease Cloud          <- Flamestrike 2120 (dispel -> disease)
#   Cripple                <- Cripple 89 (effects rewritten: 10% slow and
#                             -20 attack power for 10 sec, third effect
#                             dropped, custom tooltip)
# batch 3 slice 1 (IDs 61024-61026, minions):
#   Raise Ghoul / Raise Skeleton <- Summon Atal'ai Skeleton 12151 (guardian
#                             summon; creature entry 846/6412 and target mode
#                             32 overridden, the model's dummy 2nd effect
#                             dropped (script target 38), module re-scales to
#                             caster level)
#   Tether                 <- Renew 139 (instant friendly-target dummy; the
#                             module converts the target guardian into a
#                             permanent pet)
# batch 3 slice 2 (IDs 61027-61033, minion control + minion actives):
#   Ravage                 <- Lash of Pain 7814 (pet-bar active taught by
#                             `petcreateinfo_spell` to creature 846/6412)
#   Sacrifice Minion       <- Renew 139 (dummy; module heals + Death Pact)
#   Harvest                <- Cannibalize 20577 (dummy; module finds corpse,
#                             applies the mana-regeneration aura 61030)
#   Harvest aura           <- Cannibalize aura 20578 (health -> mana regen)
#   Death Pact (Ghoul/Skeleton) <- 20578 scaffold; +2% physical damage done /
#                             -2% physical damage taken for 30 min
#   Ghoul Frenzy           <- Renew 139 (module breaks CC; spell carries the
#                             haste auras and the script-computed heal-over-time)
# batch 3 slice 3 (IDs 61034-61046, higher minion tiers):
#   Raise Zombie/Shade/Banshee/Wraith/Bloodmage/Abomination/Wight
#                          <- Summon Atal'ai Skeleton 12151 (guardian summons,
#                             creature entry overridden: 1501/7370/10463/
#                             1800/8526/8545/11621; Abomination is gated by
#                             the module on three nearby corpses)
#   Entropic Bolt          <- Firebolt 3110 (ranged pet active taught to
#                             Banshee/Bloodmage via `petcreateinfo_spell`;
#                             melee tiers reuse Ravage 61027)
#   Death Pact (Banshee/Shade/Wraith/Hulk/Bloodmage) <- 20578 scaffold with
#                             per-kind effects (mana per 4 sec / threat /
#                             melee+cast speed / total health / spell damage)
# batch 3 slice 3c (rules realignment; items 63100-63103 have no client half):
#   Harvest        <- 20577 (same carrier; new text) + aura 61030 reworked to
#                     the 3-sec channel (duration index 27, amount 0,
#                     amplitude 3000)
#   Raise Wight    <- Renew 139 (transform carrier; 8 sec cast, dummy)
#   Raise Wight (summon) <- 12151 clone (internal guardian summon 61047)
#   existing raises gain the design CastingTimeIndex values
# batch 3 slice 3b (minion limit + corpse launcher; 61048-61050):
#   Meat Catapult  <- Thorium Grenade 19769 (thrown at a destination, target
#                     mode 16 area: X-Y Shadow damage + a 2 sec stun in 3 yd;
#                     design cast 1.5 sec, 20 yd, 1 min cooldown; the module
#                     requires and consumes one Corpse Bag item)
#   Army of the Dead R1/R2 <- Dodge 81 (passives; the module reads the learned
#                     ranks to raise the active-minion limit by +1/+2)
# Icons/costs stay the models' for now; custom tuning/tooltips come in a
# later batch (Cripple's tooltip is already custom because its effects are).
#
# DBC fields are u32: negative values must be written two's-complement
# (e.g. -11 -> 4294967285), because the patcher reads DBC values as u32.
