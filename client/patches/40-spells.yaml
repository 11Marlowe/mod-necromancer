# Spell.dbc - Necromancer class spells (batches 1-3).
#
# NOTE: in this 1.12.1 client's Spell.dbc the field the schema calls
# `NameSubtext_lang_N` is actually the spell RANK string (DBC columns
# 129-136).  We set it to "Rank N" so tooltips/spellbook show ranks.
#
# Mechanics are copied from the model spells:
# batch 1 (IDs 61010-61015):
#   Plague Bolt R1-3 <- Shadow Bolt 686/695/705
#   Reap R1-2        <- Raptor Strike 2973/14260 (mana melee strike)
#   Bone Armor       <- Frost Armor 168
# batch 2 (IDs 61016-61023, disease mechanics):
#   Call of the Grave R1-3 <- Corruption 6222/6223/7648 (dispel -> disease)
#   Desecration R1-3       <- Rain of Fire 5740/6219/11677 (dispel -> disease)
#   Disease Cloud          <- Flamestrike 2120 (dispel -> disease)
#   Cripple                <- Cripple 89 (effects rewritten: 10% slow and
#                             -20 attack power for 10 sec, third effect
#                             dropped, custom tooltip)
# batch 3 slice 1 (IDs 61024-61026, minions):
#   Raise Ghoul / Raise Skeleton <- Summon Atal'ai Skeleton 12151 (guardian
#                             summon; creature entry 846/6412 and target mode
#                             32 overridden, the model's dummy 2nd effect
#                             dropped (script target 38), module re-scales to
#                             caster level)
#   Tether                 <- Renew 139 (instant friendly-target dummy; the
#                             module converts the target guardian into a
#                             permanent pet)
# Icons/costs stay the models' for now; custom tuning/tooltips come in a
# later batch (Cripple's tooltip is already custom because its effects are).
#
# DBC fields are u32: negative values must be written two's-complement
# (e.g. -11 -> 4294967285), because the patcher reads DBC values as u32.
